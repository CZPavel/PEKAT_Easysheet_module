[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pekat-easysheet-module"
version = "0.1.0"
description = "MVP skeleton for PEKAT VISION spreadsheet-like decision bridge."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CZPavel" }]
dependencies = [
    "fastapi>=0.110,<1.0",
    "pydantic>=2.6,<3.0",
    "uvicorn[standard]>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.26,<1.0",
    "pytest>=8.0,<9.0",
]
pekat = [
    "pekat-vision-sdk>=2.3,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"
